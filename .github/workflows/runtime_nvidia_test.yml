name: Test NVIDIA runtime

on:
  pull_request:
    branches:
      - master
    paths:
      - runtime/Dockerfile.nvidia
      - .github/workflows/runtime_nvidia_test.yml

jobs:
  gstreamer:
    name: Build NVIDIA GStreamer stage
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - name: Build pinned GStreamer toolchain
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runtime/Dockerfile.nvidia
          target: gstreamer
          platforms: linux/amd64
          cache-from: type=gha,scope=neko-nvidia-gstreamer-amd64
          cache-to: type=gha,mode=max,scope=neko-nvidia-gstreamer-amd64
